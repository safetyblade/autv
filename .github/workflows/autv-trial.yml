name: AUTV Trial — full app, separate package

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/autv-trial.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/autv-trial.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: autv-isolated-trial-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      AUTV_SIGNING_KEYSTORE_BASE64: ${{ secrets.AUTV_SIGNING_KEYSTORE_BASE64 }}
      AUTV_SIGNING_STORE_PASSWORD: ${{ secrets.AUTV_SIGNING_STORE_PASSWORD }}
      AUTV_SIGNING_KEY_PASSWORD: ${{ secrets.AUTV_SIGNING_KEY_PASSWORD }}
      AUTV_SIGNING_KEYSTORE_PATH: /tmp/autv-trial-signing.jks
      AUTV_SIGNING_CERT_SHA256: ${{ vars.AUTV_SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable trial signing when configured
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$AUTV_SIGNING_KEYSTORE_BASE64" || -z "$AUTV_SIGNING_STORE_PASSWORD" || -z "$AUTV_SIGNING_KEY_PASSWORD" || -z "$AUTV_SIGNING_CERT_SHA256" ]]; then
            echo '::warning::No stable AUTV signing identity configured. This trial uses a disposable debug certificate and MAY NOT update an older Trial installation.'
            echo "AUTV_SIGNING_KEYSTORE_PATH=" >> "$GITHUB_ENV"
            echo "AUTV_TRIAL_SIGNING=disposable-debug" >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$AUTV_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$AUTV_SIGNING_KEYSTORE_PATH"
          actual=$(keytool -exportcert -keystore "$AUTV_SIGNING_KEYSTORE_PATH" -alias autv -storepass:env AUTV_SIGNING_STORE_PASSWORD | sha256sum | cut -d ' ' -f 1)
          if [[ "$actual" != "$AUTV_SIGNING_CERT_SHA256" ]]; then
            echo '::error::Trial signing differs from registered identity. Refusing silent key rotation.'
            exit 1
          fi
          echo "AUTV_TRIAL_SIGNING=permanent-distribution" >> "$GITHUB_ENV"
      - name: Compile and unit-test full isolated AUTV
        run: >-
          gradle -p android
          -PautvMediaLab=false -PautvIsolatedTrial=true
          -PautvVersionCode=${{ github.run_number }} -PautvVersionName=0.5.0-trial.${{ github.run_number }}
          :core-data:testDebugUnitTest :core-guide:testDebugUnitTest :core-player:testDebugUnitTest
          :app:testDebugUnitTest :app:assembleDebug
      - name: Package verification, signing identity and install policy
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          SIGN=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" > trial-package.txt
          grep -q "package: name='dev.prestwich.autv.trial'" trial-package.txt
          grep -q "application-label:'AUTV Trial'" trial-package.txt
          "$SIGN" verify --print-certs "$APK" > trial-signing.txt
          {
            echo 'Package: dev.prestwich.autv.trial'
            echo "Commit: $GITHUB_SHA"
            echo "Signing: $AUTV_TRIAL_SIGNING"
            echo 'Install policy: Side-by-side. Existing app data is separate. A prior Trial updates ONLY if APK certificate matches.'
            sha256sum "$APK"
          } > trial-release-notes.txt
          mkdir -p trial-distribution
          cp "$APK" trial-distribution/AUTV-Trial.apk
          cp trial-package.txt trial-signing.txt trial-release-notes.txt trial-distribution/
      - uses: actions/upload-artifact@v4
        with:
          name: AUTV-Trial-${{ github.run_number }}
          path: trial-distribution/
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing material
        if: always()
        run: rm -f /tmp/autv-trial-signing.jks
