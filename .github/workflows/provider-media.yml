name: Provider Media3 public samples
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/provider-media.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  ORG_GRADLE_PROJECT_autvMediaLab: "true"
jobs:
  public-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: JVM tests and Media Lab APK
        run: gradle -p android :app:testDebugUnitTest :core-data:testDebugUnitTest :core-guide:testDebugUnitTest :core-player:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Play official public media and exercise session recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            bash scripts/test-provider-media.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autv-media-lab
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/androidTests/connected/debug/**
            media-sample-results.txt
          retention-days: 7
