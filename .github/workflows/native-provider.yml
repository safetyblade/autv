name: AUTV Full Application Debug

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/native-provider.yml'
      - 'scripts/*android*'
      - 'scripts/verify-full-app-apk.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORG_GRADLE_PROJECT_autvMediaLab: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile AUTV, run critical JVM regressions and assemble full app
        run: gradle -p android -PautvMediaLab=false :core-data:testDebugUnitTest :core-guide:testDebugUnitTest :core-player:testDebugUnitTest :app:testDebugUnitTest :app:assembleFullAppDebug
      - name: Verify packaged application identity and television launcher
        run: python3 scripts/verify-full-app-apk.py android/app/build/outputs/apk/full-app/AUTV-Full-App-Debug.apk --output AUTV-Full-App-manifest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AUTV-Full-App-Debug
          path: |
            android/app/build/outputs/apk/full-app/AUTV-Full-App-Debug.apk
            AUTV-Full-App-manifest.txt
          if-no-files-found: error
          retention-days: 30
