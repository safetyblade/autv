name: Native provider prototype

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/native-provider.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests and debug APK
        run: gradle -p android :core-data:testDebugUnitTest :core-guide:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: autv-provider-prototype-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
