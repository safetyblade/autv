name: Native provider prototype

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/native-provider.yml'
      - '.github/workflows/native-app.yml'
      - 'scripts/*android*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify permanent signing setup continuity
        run: python3 scripts/test-android-signing-setup.py
      - name: Unit tests and debug APK
        run: gradle -p android :app:testDebugUnitTest :core-data:testDebugUnitTest :core-guide:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Verify provider routing with local fixture media
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            gradle -p android :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.prestwich.autv.SbsProviderTest,dev.prestwich.autv.ProviderQrUiTest,dev.prestwich.autv.ProviderQrIntegrationTest,dev.prestwich.autv.ProviderActivationTest,dev.prestwich.autv.ProviderSettingsUiTest,dev.prestwich.autv.ProviderPlaybackTest,dev.prestwich.autv.provider.EncryptedProviderSessionStoreTest
            bash scripts/test-android-update.sh
      - uses: actions/upload-artifact@v4
        with:
          name: autv-provider-prototype-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
