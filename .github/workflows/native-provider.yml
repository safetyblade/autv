name: AUTV Android QA — not a release

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/native-provider.yml'
      - 'scripts/*android*'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: autv-android-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ORG_GRADLE_PROJECT_autvMediaLab: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify Seven regression baseline
        run: python3 scripts/verify-seven-baseline.py
      - name: Run JVM tests, compile Android and instrumentation
        run: >-
          gradle -p android -PautvMediaLab=false
          :core-data:testDebugUnitTest :core-guide:testDebugUnitTest :core-player:testDebugUnitTest
          :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:assembleDebug
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Android Cast and provider UI regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          profile: pixel_c
          arch: x86_64
          disable-animations: true
          script: bash scripts/test-focused-android-providers.sh
      - name: Publish QA evidence only (not an installable update)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AUTV-Android-QA-${{ github.run_number }}
          path: |
            settings-screenshots/**
            cast-screenshots/**
            android-ui-reports/**
            android/app/build/reports/tests/**
            android/app/build/reports/androidTests/connected/debug/**
          if-no-files-found: warn
          retention-days: 30
