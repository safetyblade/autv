name: Refresh playlist

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download source playlists
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/plex_au.m3u" --output base_upstream.m3u
          curl --fail --silent --show-error --location "https://www.apsattv.com/ssungaus.m3u" --output secondary_upstream.m3u
          curl --fail --silent --show-error --location "https://www.apsattv.com/aulg.m3u" --output lg_upstream.m3u

      - name: Build playlist
        run: python3 scripts/merge.py

      - name: Publish generated files
        shell: bash
        run: |
          set -euo pipefail
          rm -f base_upstream.m3u secondary_upstream.m3u lg_upstream.m3u

          if git diff --quiet -- playlist.m3u curated.xml; then
            echo "No generated file changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u curated.xml
          git commit -m "chore: refresh playlist"
          git push
