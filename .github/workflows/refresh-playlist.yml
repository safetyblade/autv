name: Refresh playlist

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-playlist.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download source playlists
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/plex_au.m3u" --output base_upstream.m3u
          curl --fail --silent --show-error --location "https://www.apsattv.com/ssungaus.m3u" --output secondary_upstream.m3u
          curl --fail --silent --show-error --location "https://www.apsattv.com/aulg.m3u" --output lg_upstream.m3u
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/blodt/pluto-tv-playlists-2026/main/output/plutotv_us.m3u8" --output pluto_us_upstream.m3u
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/blodt/pluto-tv-playlists-2026/main/output/plutotv_ca.m3u8" --output pluto_ca_upstream.m3u
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/blodt/pluto-tv-playlists-2026/main/output/plutotv_uk.m3u8" --output pluto_gb_upstream.m3u
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/roku_all.m3u" --output roku_upstream.m3u
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/BuddyChewChew/xumo-playlist-generator/main/playlists/xumo_playlist.m3u" --output xumo_upstream.m3u
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/BuddyChewChew/tubi-scraper/main/tubi_playlist.m3u" --output tubi_upstream.m3u
          curl --fail --silent --show-error --location "https://github.com/matthuisman/i.mjh.nz/raw/master/Plex/au.xml.gz" --output epg_plex_au.xml.gz
          curl --fail --silent --show-error --location "https://github.com/matthuisman/i.mjh.nz/raw/master/PlutoTV/us.xml.gz" --output epg_pluto_us.xml.gz
          curl --fail --silent --show-error --location "https://github.com/matthuisman/i.mjh.nz/raw/master/PlutoTV/gb.xml.gz" --output epg_pluto_gb.xml.gz
          curl --fail --silent --show-error --location "https://github.com/matthuisman/i.mjh.nz/raw/master/PlutoTV/ca.xml.gz" --output epg_pluto_ca.xml.gz
          curl --fail --silent --show-error --location "https://github.com/matthuisman/i.mjh.nz/raw/master/Roku/all.xml.gz" --output epg_roku_all.xml.gz
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/BuddyChewChew/xumo-playlist-generator/main/playlists/xumo_epg.xml.gz" --output epg_xumo.xml.gz
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/BuddyChewChew/tubi-scraper/main/tubi_epg.xml" --output epg_tubi.xml
          curl --fail --silent --show-error --location "https://i.mjh.nz/SamsungTVPlus/all.xml.gz" --output epg_samsung_all.xml.gz

      - name: Build playlist
        run: python3 scripts/merge.py

      - name: Apply channel guide
        run: python3 scripts/apply_guide.py

      - name: Build combined EPG
        run: python3 scripts/build_epg.py

      - name: Build native guide snapshot
        run: python3 native/tools/build_guide.py

      - name: Publish generated files
        shell: bash
        run: |
          set -euo pipefail
          rm -f base_upstream.m3u secondary_upstream.m3u lg_upstream.m3u pluto_us_upstream.m3u pluto_ca_upstream.m3u pluto_gb_upstream.m3u roku_upstream.m3u epg_plex_*.xml.gz epg_pluto_*.xml.gz epg_roku_*.xml.gz xumo_upstream.m3u epg_xumo.xml.gz tubi_upstream.m3u epg_tubi.xml epg_samsung_all.xml.gz

          if git diff --quiet -- playlist.m3u curated.xml epg.xml.gz guide.json; then
            echo "No generated file changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u curated.xml epg.xml.gz guide.json
          git commit -m "chore: refresh playlist"
          git push
