name: Refresh playlist

on:
  workflow_dispatch:
  schedule:
    # Pluto v2 sessions can expire in 24h; refresh before expiry.
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-playlist
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download source playlists
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/plex_au.m3u" --output base_upstream.m3u
          curl --fail --silent --show-error --location "https://www.apsattv.com/ssungaus.m3u" --output secondary_upstream.m3u
          curl --fail --silent --show-error --location "https://www.apsattv.com/aulg.m3u" --output lg_upstream.m3u
          # Never merge an upstream Pluto catalogue solely because curl returned 200:
          # its JWTs may already be expired. Try maintained alternative catalogues,
          # re-authenticating and validating each regional file before accepting it.
          # Reject a broken boot request once, rather than trying all mirrors nine times.
          pluto_boot_ok=1
          python3 scripts/probe_pluto_boot.py || pluto_boot_ok=0
          for region in us ca uk; do
            case "$region" in
              uk) dest=pluto_gb_upstream.m3u ;;
              *) dest="pluto_${region}_upstream.m3u" ;;
            esac
            valid=0
            if [ "$pluto_boot_ok" -eq 1 ]; then
            for owner in blodt jns630 LISTAMU; do
              case "$owner" in
                blodt) repository=blodt/pluto-tv-playlists-2026 ;;
                jns630) repository=jns630/Pluto-TV-Playlists-2026 ;;
                LISTAMU) repository=LISTAMU/Pluto-TV-Playlists-2026 ;;
              esac
              url="https://raw.githubusercontent.com/${repository}/main/output/plutotv_${region}.m3u8"
              if curl --fail --silent --show-error --location "$url" --output "$dest" &&
                 python3 scripts/refresh_pluto_sessions.py "$dest" &&
                 python3 scripts/check_pluto_freshness.py "$dest"; then
                echo "Selected fresh Pluto ${region} catalogue from ${repository}"
                valid=1
                break
              fi
              echo "Pluto ${region} source ${repository} is unavailable or stale"
            done
            fi
            if [ "$valid" -ne 1 ]; then
              echo "::warning::No fresh Pluto ${region} catalogue; excluding this region from this refresh"
              printf "#EXTM3U\n" > "$dest"
              touch pluto_degraded.marker
            fi
          done
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/roku_all.m3u" --output roku_upstream.m3u
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/BuddyChewChew/xumo-playlist-generator/main/playlists/xumo_playlist.m3u" --output xumo_upstream.m3u
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/BuddyChewChew/tubi-scraper/main/tubi_playlist.m3u" --output tubi_upstream.m3u
          curl --fail --silent --show-error --location "https://github.com/matthuisman/i.mjh.nz/raw/master/Plex/au.xml.gz" --output epg_plex_au.xml.gz
          curl --fail --silent --show-error --location "https://github.com/matthuisman/i.mjh.nz/raw/master/PlutoTV/us.xml.gz" --output epg_pluto_us.xml.gz
          curl --fail --silent --show-error --location "https://github.com/matthuisman/i.mjh.nz/raw/master/PlutoTV/gb.xml.gz" --output epg_pluto_gb.xml.gz
          curl --fail --silent --show-error --location "https://github.com/matthuisman/i.mjh.nz/raw/master/PlutoTV/ca.xml.gz" --output epg_pluto_ca.xml.gz
          curl --fail --silent --show-error --location "https://github.com/matthuisman/i.mjh.nz/raw/master/Roku/all.xml.gz" --output epg_roku_all.xml.gz
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/BuddyChewChew/xumo-playlist-generator/main/playlists/xumo_epg.xml.gz" --output epg_xumo.xml.gz
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/BuddyChewChew/tubi-scraper/main/tubi_epg.xml" --output epg_tubi.xml
          curl --fail --silent --show-error --location "https://i.mjh.nz/SamsungTVPlus/all.xml.gz" --output epg_samsung_all.xml.gz

      # Channel 203 was intentionally withdrawn; its standalone resolver must not
      # gate publication of the remaining active channels.
      - name: Build playlist
        run: python3 scripts/merge.py

      - name: Apply channel guide
        run: python3 scripts/apply_guide.py

      - name: Quarantine expired Pluto streams
        run: python3 scripts/quarantine_expired_pluto.py playlist.m3u

      - name: Validate Pluto JWT freshness before publishing
        shell: bash
        run: |
          if [ -f pluto_degraded.marker ]; then
            python3 scripts/check_pluto_freshness.py playlist.m3u --allow-empty
          else
            python3 scripts/check_pluto_freshness.py playlist.m3u
          fi

      - name: Audit legacy and Pluto stream reachability (advisory)
        run: python3 scripts/audit_legacy_streams.py

      - name: Build combined EPG
        run: python3 scripts/build_epg.py

      - name: Build native guide snapshot
        run: python3 native/tools/build_guide.py

      - name: Publish generated files
        shell: bash
        run: |
          set -euo pipefail
          rm -f base_upstream.m3u secondary_upstream.m3u lg_upstream.m3u pluto_us_upstream.m3u pluto_ca_upstream.m3u pluto_gb_upstream.m3u roku_upstream.m3u epg_plex_*.xml.gz epg_pluto_*.xml.gz epg_roku_*.xml.gz xumo_upstream.m3u epg_xumo.xml.gz tubi_upstream.m3u epg_tubi.xml epg_samsung_all.xml.gz dynamic_sources.m3u pluto_degraded.marker

          if git diff --quiet -- playlist.m3u curated.xml epg.xml.gz guide.json; then
            echo "No generated file changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u curated.xml epg.xml.gz guide.json
          git commit -m "chore: refresh playlist"

          # Avoid a late push failure if main moved while the refresh was running.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
