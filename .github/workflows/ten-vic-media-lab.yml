name: Network 10 VIC Experimental Media Lab APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/app/src/debug/java/dev/prestwich/autv/MediaLabSession.kt'
      - '.github/workflows/ten-vic-media-lab.yml'

permissions:
  contents: read

jobs:
  ten-media-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build isolated candidate player
        run: gradle -p android -PautvMediaLab=true :app:assembleDebug
      - name: Upload experimental lab APK (not AUTV full app)
        uses: actions/upload-artifact@v4
        with:
          name: AUTV-Ten-VIC-Experimental-Media-Lab
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
