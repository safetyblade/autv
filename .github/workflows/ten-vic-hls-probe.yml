name: Network 10 VIC HLS probe tests

on:
  pull_request:
    paths:
      - 'scripts/probe_ten_vic_hls.py'
      - 'tests/test_ten_vic_probe.py'
      - '.github/workflows/ten-vic-hls-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify read-only probe parsing and URL safety
        run: python -m unittest discover -s tests -p test_ten_vic_probe.py -v
      - name: Compile probe
        run: python -m py_compile scripts/probe_ten_vic_hls.py

# Deliberately no media network fetch in GitHub-hosted CI:
# AU geolocation, rights and physical Media3 playback must be tested on device.
