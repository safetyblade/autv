name: Native app

on:
  workflow_dispatch:

permissions:
  contents: read

# One distribution workflow owns the monotonic build sequence and signing identity.
concurrency:
  group: autv-android-distribution
  cancel-in-progress: false

jobs:
  android-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTV_SIGNING_KEYSTORE_BASE64: ${{ secrets.AUTV_SIGNING_KEYSTORE_BASE64 }}
      AUTV_SIGNING_STORE_PASSWORD: ${{ secrets.AUTV_SIGNING_STORE_PASSWORD }}
      AUTV_SIGNING_KEY_PASSWORD: ${{ secrets.AUTV_SIGNING_KEY_PASSWORD }}
      AUTV_SIGNING_KEYSTORE_PATH: /tmp/autv-distribution.jks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore permanent signing identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$AUTV_SIGNING_KEYSTORE_BASE64" || -z "$AUTV_SIGNING_STORE_PASSWORD" || -z "$AUTV_SIGNING_KEY_PASSWORD" ]]; then
            echo '::error::Run scripts/setup-android-signing.sh once. Distribution requires permanent signing secrets.'
            exit 1
          fi
          printf '%s' "$AUTV_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$AUTV_SIGNING_KEYSTORE_PATH"
      - name: Test and build signed update
        run: >-
          gradle -p android :core-data:testDebugUnitTest :core-guide:testDebugUnitTest :app:assembleRelease
          -PautvVersionCode=$((1000 + ${{ github.run_number }}))
          -PautvVersionName=0.5.${{ github.run_number }}
      - name: Verify APK signature
        shell: bash
        run: |
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$apksigner_path" verify --verbose android/app/build/outputs/apk/release/app-release.apk
      - name: Upload installable update
        uses: actions/upload-artifact@v4
        with:
          name: autv-update-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$AUTV_SIGNING_KEYSTORE_PATH"
