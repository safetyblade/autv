name: Native app

on:
  workflow_dispatch:

permissions:
  contents: read

# One distribution workflow owns the monotonic build sequence and signing identity.
concurrency:
  group: autv-android-distribution
  cancel-in-progress: false

jobs:
  android-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTV_SIGNING_KEYSTORE_BASE64: ${{ secrets.AUTV_SIGNING_KEYSTORE_BASE64 }}
      AUTV_SIGNING_STORE_PASSWORD: ${{ secrets.AUTV_SIGNING_STORE_PASSWORD }}
      AUTV_SIGNING_KEY_PASSWORD: ${{ secrets.AUTV_SIGNING_KEY_PASSWORD }}
      AUTV_SIGNING_KEYSTORE_PATH: /tmp/autv-distribution.jks
      AUTV_SIGNING_CERT_SHA256: ${{ vars.AUTV_SIGNING_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore permanent signing identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$AUTV_SIGNING_KEYSTORE_BASE64" || -z "$AUTV_SIGNING_STORE_PASSWORD" || -z "$AUTV_SIGNING_KEY_PASSWORD" || -z "$AUTV_SIGNING_CERT_SHA256" ]]; then
            echo '::error::Run scripts/setup-android-signing.sh once. Distribution requires permanent signing secrets.'
            exit 1
          fi
          printf '%s' "$AUTV_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$AUTV_SIGNING_KEYSTORE_PATH"
          actual_certificate=$(keytool -exportcert -keystore "$AUTV_SIGNING_KEYSTORE_PATH" -alias autv -storepass:env AUTV_SIGNING_STORE_PASSWORD | sha256sum | cut -d ' ' -f 1)
          if [[ "$actual_certificate" != "$AUTV_SIGNING_CERT_SHA256" ]]; then
            echo '::error::Signing certificate does not match the permanent AUTV identity. Restore the original signing secrets.'
            exit 1
          fi
      - name: Test and build signed update
        run: >-
          gradle -p android :app:testDebugUnitTest :core-data:testDebugUnitTest :core-guide:testDebugUnitTest :app:assembleRelease
          -PautvVersionCode=$((1000 + ${{ github.run_number }}))
          -PautvVersionName=0.5.${{ github.run_number }}
      - name: Verify main-package APK, certificate and version
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          SIGN=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$SIGN" verify --verbose --print-certs "$APK" > signed-apk-certificate.txt
          "$AAPT" dump badging "$APK" > signed-apk-manifest.txt
          grep -q "package: name='dev.prestwich.autv'" signed-apk-manifest.txt
          test -s signed-apk-certificate.txt
          mkdir -p signed-distribution
          cp "$APK" signed-distribution/AUTV-Signed-Update.apk
          cp signed-apk-certificate.txt signed-apk-manifest.txt signed-distribution/
          {
            echo "Commit: $GITHUB_SHA"
            echo "Build versionCode: $((1000 + ${{ github.run_number }}))"
            echo 'Package: dev.prestwich.autv'
            echo 'Update only if certificate matches installed package and versionCode is higher.'
            sha256sum "$APK"
          } > signed-distribution/README.txt
      - name: Upload signed update candidate
        uses: actions/upload-artifact@v4
        with:
          name: AUTV-Signed-Update-${{ github.run_number }}
          path: signed-distribution/
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$AUTV_SIGNING_KEYSTORE_PATH"
