name: Publish printable AUTV TV guide
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - TV_GUIDE.md
      - scripts/build_printable_guide.py
      - .github/workflows/publish-printable-guide.yml

permissions:
  contents: write

concurrency:
  group: printable-guide-publish
  cancel-in-progress: false

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PDF renderer
        run: python -m pip install reportlab
      - name: Render full printable channel directory
        run: python scripts/build_printable_guide.py
      - name: Validate nonempty PDF and expected directory count
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("docs/AUTV_Printable_TV_Guide.pdf")
          assert p.exists() and p.stat().st_size > 30000
          assert p.read_bytes().startswith(b"%PDF-")
          print(f"Printable PDF ready: {p.stat().st_size} bytes")
          PY
      - name: Upload print-ready PDF
        uses: actions/upload-artifact@v4
        with:
          name: AUTV-Printable-TV-Guide
          path: docs/AUTV_Printable_TV_Guide.pdf
          retention-days: 90
      - name: Publish stable PDF to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AUTV_Printable_TV_Guide.pdf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: update printable AUTV channel guide"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
