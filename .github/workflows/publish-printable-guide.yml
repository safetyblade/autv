name: Publish approved AUTV booklet
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - channel_guide.csv
      - android/app/src/main/java/dev/prestwich/autv/provider/AustralianLiveChannels.kt
      - scripts/build_printable_guide.py
      - .github/workflows/publish-printable-guide.yml

permissions:
  contents: write

concurrency:
  group: printable-guide-publish
  cancel-in-progress: false

jobs:
  booklet:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PDF dependencies
        run: python -m pip install reportlab pypdf
      - name: Build locked-layout reading and print editions
        run: python scripts/build_printable_guide.py
      - name: Verify booklet geometry and full source-channel coverage
        run: |
          python - <<'PY'
          import csv, re
          from pathlib import Path
          from pypdf import PdfReader
          base=Path("docs")
          read=PdfReader(str(base/"AUTV_TV_Booklet_Reader.pdf"))
          printpdf=PdfReader(str(base/"AUTV_TV_Booklet_Print.pdf"))
          with open("channel_guide.csv",encoding="utf-8-sig",newline="") as f:
              names=[r["Channel name"] for r in csv.DictReader(f) if r["Status"].lower()=="active"]
          native=re.findall(r'LiveChannel\(\s*(\d+)\s*,\s*"([^"]+)"',
              Path("android/app/src/main/java/dev/prestwich/autv/provider/AustralianLiveChannels.kt").read_text())
          assert len(read.pages)%4==0
          assert len(printpdf.pages)==len(read.pages)//2
          assert len(names)>=600 and len(native)>=6
          for f in ("AUTV_TV_Booklet_Reader.pdf","AUTV_TV_Booklet_Print.pdf"):
              assert (base/f).stat().st_size>30000
          print(f"Validated {len(names)} curated channels and {len(native)} Free-To-Air channels; "
                f"{len(read.pages)} reading pages; {len(printpdf.pages)} imposed A4 print faces.")
          PY
      - name: Upload approved booklet editions
        uses: actions/upload-artifact@v4
        with:
          name: AUTV-Approved-TV-Booklet
          path: |
            docs/AUTV_TV_Booklet_Reader.pdf
            docs/AUTV_TV_Booklet_Print.pdf
          retention-days: 90
      - name: Publish stable booklet links
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AUTV_TV_Booklet_Reader.pdf docs/AUTV_TV_Booklet_Print.pdf
          if git diff --cached --quiet; then
            echo "Booklet layout and catalogue unchanged."
            exit 0
          fi
          git commit -m "docs: refresh approved AUTV reading and print booklets"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
